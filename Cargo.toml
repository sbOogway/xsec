[package]
name = "xsectional-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
nautilus-core = { version = "0.61" }
nautilus-common = { version = "0.61" }
nautilus-model = { version = "0.61" }
nautilus-trading = { version = "0.61" }
nautilus-bybit = { version = "0.61" }
nautilus-backtest = { version = "0.61" }
nautilus-live = { version = "0.61" }
bon = "3.10.0"
anyhow = "1.0.104"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "query"] }
tokio = { version = "1.53.1", features = ["fs", "macros", "rt-multi-thread", "sync", "time"] }
parquet = { version = "=53.4.0", default-features = false, features = ["arrow", "snap", "lz4", "zstd", "brotli"] }
arrow-array = "=53.4.0"
arrow-schema = "=53.4.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4.45", features = ["serde"] }
log = "0.4.34"
